name: Clau
options:
  bundleIdPrefix: cat.sergicastillo
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: Q479WYX9TL
    MARKETING_VERSION: '0.1'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Clau:
    type: application
    platform: iOS
    sources: [Clau]
    info:
      path: Clau/Info.plist
      properties:
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        CFBundleDisplayName: Clau
        CFBundleDevelopmentRegion: ca
        CFBundleLocalizations: [ca]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Light
        NSMicrophoneUsageDescription: Clau escolta el piano per saber quina nota toques. El so no es grava ni surt de l'aparell.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cat.sergicastillo.clau
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ClauUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ClauUITests]
    dependencies:
      - target: Clau
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: cat.sergicastillo.clau.uitests
schemes:
  Clau:
    build:
      targets:
        Clau: all
    test:
      targets: [ClauUITests]
    archive:
      config: Release
